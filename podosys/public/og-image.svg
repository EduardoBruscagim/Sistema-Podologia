<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="radial-glow-1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radial-glow-2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#radial-glow-1)" />
  <rect width="1200" height="630" fill="url(#radial-glow-2)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Container -->
  <g transform="translate(100, 100)">
    <!-- Logo Badge -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="16" fill="url(#primary-grad)" />
      <g fill="white" transform="translate(14, 14)">
        <path d="M7 16c-3.3 0-5 2.2-5 5.5S4 27 8 27c3.3 0 6-2.5 6-5.8 0-3.2-3.7-5.2-7-5.2z" opacity="0.95" />
        <path d="M12.5 7.5C9.5 7.5 7 10 7 13.5c0 1.2.4 2.3 1.2 3.1 2.2-.4 5.3-.2 7.8.6.6-1.1 1-2.4 1-3.7 0-3.3-2-6-4.5-6z" opacity="0.95" />
        <circle cx="13" cy="3.5" r="2.2" />
        <circle cx="18" cy="4.8" r="1.7" />
        <circle cx="21.5" cy="7.8" r="1.4" />
        <circle cx="23.2" cy="11.5" r="1.2" />
      </g>
      <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.5px">PodoSys</text>
    </g>

    <!-- Tagline Badge -->
    <g transform="translate(0, 105)">
      <rect width="280" height="36" rx="18" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
      <circle cx="18" cy="18" r="4" fill="#3b82f6" />
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" letter-spacing="0.5px">GESTÃO ESPECIALIZADA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5px">
      Agenda inteligente para
    </text>
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="52" font-weight="800" fill="#3b82f6" letter-spacing="-1.5px">
      clínicas de podologia
    </text>

    <!-- Subtitle -->
    <text x="0" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Gerencie horários comerciais, evite conflitos de agendamento e ofereça
    </text>
    <text x="0" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      uma experiência premium para seus pacientes em tempo real.
    </text>
  </g>

  <!-- URL footer -->
  <g transform="translate(100, 540)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="600" fill="#64748b">
      podosys.vercel.app
    </text>
  </g>
</svg>
