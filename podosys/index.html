<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primary Tags -->
    <title>PodoSys — Agenda Inteligente para Clínicas de Podologia</title>
    <meta
      name="title"
      content="PodoSys — Agenda Inteligente para Clínicas de Podologia"
    />
    <meta
      name="description"
      content="Gerencie horários comerciais, evite conflitos de agendamento e ofereça uma experiência premium para seus pacientes de podologia em tempo real."
    />
    <meta
      name="keywords"
      content="podologia, sistema para podólogos, agenda médica, gestão de clínica, agendamento de consultas, podosys"
    />
    <meta name="author" content="PodoSys" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://podosys.vercel.app/" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Colors for Light / Dark mode -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://podosys.vercel.app/" />
    <meta property="og:site_name" content="PodoSys" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="PodoSys — Agenda Inteligente para Clínicas de Podologia" />
    <meta
      property="og:description"
      content="Gerencie horários comerciais, evite conflitos de agendamento e ofereça uma experiência premium para seus pacientes."
    />
    <meta property="og:image" content="https://podosys.vercel.app/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PodoSys — Gestão e Agenda para Clínicas de Podologia" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://podosys.vercel.app/" />
    <meta name="twitter:title" content="PodoSys — Agenda Inteligente para Clínicas de Podologia" />
    <meta
      name="twitter:description"
      content="Gerencie horários comerciais, evite conflitos de agendamento e ofereça uma experiência premium para seus pacientes."
    />
    <meta name="twitter:image" content="https://podosys.vercel.app/og-image.svg" />
    <meta name="twitter:image:alt" content="PodoSys — Gestão e Agenda para Clínicas de Podologia" />

    <!-- JSON-LD Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PodoSys",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://podosys.vercel.app",
        "description": "Sistema de gestão e agenda inteligente em tempo real especializado para clínicas e consultórios de podologia.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "featureList": [
          "Gestão de agendamentos em tempo real",
          "Prevenção de conflito de horários",
          "Prontuário e cadastro de pacientes",
          "Interface responsiva com tema escuro e claro"
        ]
      }
    </script>

    <!-- Plus Jakarta Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-FOUC: aplica .dark antes do primeiro paint -->
    <script>
      if (
        localStorage.theme === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
