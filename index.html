    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Angélica Eduarda | Podologia Especializada" />
    <meta property="og:title" content="Angélica Eduarda | Podologia Especializada" />

      name="twitter:description"
      content="Podologia completa com atendimento domiciliar no seu horário. Agende com confirmação imediata."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>Angélica Eduarda | Podologia Especializada</title>
    <!-- Prevenção de FOUC: Inserido script síncrono no <head> para aplicação imediata do tema escuro/claro salvo antes do primeiro ciclo de renderização -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = theme === 'dark' || (!theme && systemPrefersDark)
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.setAttribute('data-theme', 'dark')
          } else {
            document.documentElement.classList.remove('dark')
            document.documentElement.setAttribute('data-theme', 'light')
          }
          if (theme) {
            var metas = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < metas.length; i++) {
              if (i === 0) {
                metas[i].removeAttribute('media')
                metas[i].setAttribute('content', isDark ? '#020617' : '#ffffff')
              } else if (metas[i].parentNode) {
                metas[i].parentNode.removeChild(metas[i])
              }
            }
          }
        } catch (_) {}
      })()
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="min-h-screen bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased font-sans selection:bg-apple-blue selection:text-white transition-colors duration-300 break-words flex flex-col"
  >
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
